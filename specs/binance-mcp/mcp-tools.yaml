version: "1.0"

service:
  name: binance-mcp
  description: Binance Trading MCP Server
  sdk: github.com/ccxt/go-binance

tools:

# ============================================================
# SPOT TRADING
# ============================================================

  create_spot_order:
    category: spot_trading
    description: Create spot market or limit orders

    input:
      symbol:
        type: string
        required: true

      side:
        type: string
        enum: [BUY, SELL]
        required: true

      type:
        type: string
        enum:
          - MARKET
          - LIMIT
          - LIMIT_MAKER
        required: true

      quantity:
        type: number
        required: true

      price:
        type: number
        required: false

    output:
      orderId: integer
      symbol: string
      status: string

# ============================================================
# ORDER MANAGEMENT
# ============================================================

  cancel_order:
    category: order_management
    description: Cancel a single order

    input:
      symbol:
        type: string
        required: true

      orderId:
        type: integer
        required: true

  get_open_orders:
    category: order_management
    description: Get all open orders

    input:
      symbol:
        type: string
        required: false

  get_order_status:
    category: order_management
    description: Get order status

    input:
      symbol:
        type: string
        required: true

      orderId:
        type: integer
        required: true

  get_my_trades:
    category: order_management
    description: Get account trade history

    input:
      symbol:
        type: string
        required: true

      limit:
        type: integer
        default: 100

  cancel_all_orders:
    category: order_management
    description: Cancel all open orders for a symbol

    input:
      symbol:
        type: string
        required: true

# ============================================================
# RISK CONTROL
# ============================================================

  create_stop_loss_order:
    category: risk_control
    description: Create stop loss order

    input:
      symbol:
        type: string
        required: true

      side:
        type: string
        enum: [BUY, SELL]

      quantity:
        type: number

      stopPrice:
        type: number

  create_take_profit_order:
    category: risk_control
    description: Create take profit order

    input:
      symbol:
        type: string

      side:
        type: string
        enum: [BUY, SELL]

      quantity:
        type: number

      stopPrice:
        type: number

  create_stop_limit_order:
    category: risk_control
    description: Create stop limit order

    input:
      symbol:
        type: string

      side:
        type: string
        enum: [BUY, SELL]

      quantity:
        type: number

      stopPrice:
        type: number

      limitPrice:
        type: number

  create_trailing_stop_order:
    category: risk_control
    description: Create trailing stop order

    input:
      symbol:
        type: string

      side:
        type: string
        enum: [BUY, SELL]

      quantity:
        type: number

      callbackRate:
        type: number

  create_oco_order:
    category: risk_control
    description: Create OCO order

    input:
      symbol:
        type: string

      side:
        type: string
        enum: [BUY, SELL]

      quantity:
        type: number

      price:
        type: number

      stopPrice:
        type: number

      stopLimitPrice:
        type: number

# ============================================================
# MARKET DATA
# ============================================================

  get_ticker:
    category: market_data
    description: Get latest ticker

    input:
      symbol:
        type: string
        required: true

  get_order_book:
    category: market_data
    description: Get market depth

    input:
      symbol:
        type: string

      limit:
        type: integer
        default: 100

  get_klines:
    category: market_data
    description: Get candlestick data

    input:
      symbol:
        type: string

      interval:
        type: string
        enum:
          - 1m
          - 3m
          - 5m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
          - 1w
          - 1M

      limit:
        type: integer
        default: 500

  get_funding_rate:
    category: market_data
    description: Get perpetual funding rate

    input:
      symbol:
        type: string

# ============================================================
# OPTIONS
# ============================================================

  create_option_order:
    category: options

    input:
      symbol:
        type: string

      side:
        type: string
        enum: [BUY, SELL]

      quantity:
        type: number

      price:
        type: number

  get_option_chain:
    category: options

    input:
      underlying:
        type: string

  get_option_positions:
    category: options

    input: {}

  get_option_info:
    category: options

    input:
      symbol:
        type: string

# ============================================================
# FUTURES / CONTRACTS
# ============================================================

  create_contract_order:
    category: futures

    input:
      symbol:
        type: string

      side:
        type: string
        enum: [BUY, SELL]

      type:
        type: string
        enum:
          - MARKET
          - LIMIT
          - STOP
          - TAKE_PROFIT

      quantity:
        type: number

      price:
        type: number

  close_position:
    category: futures
    description: Close entire position

    input:
      symbol:
        type: string

  get_futures_positions:
    category: futures

    input: {}

# ============================================================
# ACCOUNT
# ============================================================

  get_balance:
    category: account

    input:
      asset:
        type: string
        required: false

  get_positions:
    category: account

    input: {}

  set_leverage:
    category: account

    input:
      symbol:
        type: string

      leverage:
        type: integer
        minimum: 1
        maximum: 125

  set_margin_mode:
    category: account

    input:
      symbol:
        type: string

      marginMode:
        type: string
        enum:
          - ISOLATED
          - CROSSED

  transfer_funds:
    category: account

    input:
      asset:
        type: string

      amount:
        type: number

      fromAccount:
        type: string
        enum:
          - SPOT
          - FUNDING
          - MARGIN
          - FUTURES

      toAccount:
        type: string
        enum:
          - SPOT
          - FUNDING
          - MARGIN
          - FUTURES

# ============================================================
# SYSTEM
# ============================================================

  get_server_info:
    category: system

    input: {}

    output:
      serverTime: integer
      version: string
      environment: string

# ============================================================
# COMMON REQUIREMENTS
# ============================================================

requirements:

  authentication:
    apiKey: BINANCE_API_KEY
    secretKey: BINANCE_SECRET_KEY

  observability:
    opentelemetry: true

  retries:
    enabled: true
    maxAttempts: 3

  rateLimiting:
    enabled: true

  circuitBreaker:
    enabled: true

  timeout:
    seconds: 30